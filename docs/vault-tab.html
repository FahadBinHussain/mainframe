<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mainframe vault approval</title>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #238636;
    --accent-hover: #2ea043;
    --accent-blue: #1f6feb;
    --danger: #f85149;
    --focus: #388bfd;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa;
      --card-bg: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --text-muted: #57606a;
      --accent: #2da44e;
      --accent-hover: #2c974b;
      --accent-blue: #0969da;
      --danger: #cf222e;
      --focus: #0969da;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 520px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.75rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  }
  .header {
    text-align: center;
    margin-bottom: 1.5rem;
  }
  /* Rule 10: motion icons always */
  .icon-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(35, 134, 54, 0.15);
    margin-bottom: 0.75rem;
    animation: icon-float 3s ease-in-out infinite alternate;
  }
  .icon-wrap.waiting {
    background: rgba(31, 111, 235, 0.15);
    animation: icon-pulse 2s ease-in-out infinite;
  }
  .icon-wrap.error {
    background: rgba(248, 81, 73, 0.15);
    animation: icon-shake 0.5s ease-in-out;
  }
  @keyframes icon-float {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-6px) scale(1.05); }
  }
  @keyframes icon-pulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(31, 111, 235, 0.4); }
    70% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(31, 111, 235, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(31, 111, 235, 0); }
  }
  @keyframes icon-shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  .icon-svg {
    width: 32px;
    height: 32px;
    fill: currentColor;
    color: var(--accent);
  }
  .icon-wrap.waiting .icon-svg { color: var(--accent-blue); }
  .icon-wrap.error .icon-svg { color: var(--danger); }
  h2 {
    margin: 0 0 0.5rem;
    font-size: 1.4rem;
    font-weight: 600;
  }
  p {
    margin: 0 0 1rem;
    color: var(--text-muted);
    font-size: 0.95rem;
  }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 20px;
    background: rgba(35, 134, 54, 0.2);
    color: var(--accent);
    margin-bottom: 0.75rem;
  }
  button {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1.05rem;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #ffffff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--accent-hover); }
  button:active { transform: scale(0.98); }
  #bio-btn svg {
    margin-right: 0.5rem;
    animation: bio-pulse 2.5s ease-in-out infinite alternate;
  }
  @keyframes bio-pulse {
    0% { transform: scale(1); opacity: 0.85; }
    100% { transform: scale(1.18); opacity: 1; }
  }
  .verify-card {
    background: rgba(31, 111, 235, 0.08);
    border: 1px solid var(--accent-blue);
    border-radius: 12px;
    padding: 1.15rem 1rem;
    margin-bottom: 1.25rem;
    text-align: center;
    animation: verify-pulse 3s ease-in-out infinite alternate;
  }
  @keyframes verify-pulse {
    0% { box-shadow: 0 0 0 rgba(31, 111, 235, 0); }
    100% { box-shadow: 0 0 16px rgba(31, 111, 235, 0.35); }
  }
  .verify-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent-blue);
    margin-bottom: 0.25rem;
  }
  .verify-number {
    font-size: 2.8rem;
    font-weight: 800;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.15em;
    color: var(--text);
    margin: 0.25rem 0;
    line-height: 1;
  }
  .verify-sub {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 0.5rem;
  }
  .verify-meta {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem;
    font-size: 0.75rem;
  }
  .meta-tag {
    background: rgba(255, 255, 255, 0.06);
    padding: 0.2rem 0.55rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .meta-tag .tag-icon {
    display: inline-block;
  }
  .icon-host {
    animation: host-sway 2.5s ease-in-out infinite alternate;
  }
  @keyframes host-sway {
    0% { transform: translateY(0); }
    100% { transform: translateY(-2px); }
  }
  .icon-agent {
    animation: agent-bob 2.8s ease-in-out infinite alternate;
  }
  @keyframes agent-bob {
    0% { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(8deg) scale(1.12); }
  }
  .icon-model {
    animation: model-pulse 2.2s ease-in-out infinite alternate;
  }
  @keyframes model-pulse {
    0% { transform: scale(1); opacity: 0.85; }
    100% { transform: scale(1.15); opacity: 1; }
  }
  .icon-ctx {
    animation: ctx-spark 1.8s ease-in-out infinite alternate;
  }
  @keyframes ctx-spark {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-1.5px) scale(1.15); }
  }
  button:disabled {
    background: #484f58;
    cursor: not-allowed;
    transform: none;
  }
  .btn-blue { background: var(--accent-blue); }
  .btn-blue:hover { background: #388bfd; }
  .btn-secondary {
    background: transparent;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: normal;
    padding: 0.5rem;
    margin-top: 0.75rem;
    text-decoration: underline;
  }
  .btn-secondary:hover { color: var(--text); background: transparent; }
  input[type="password"] {
    width: 100%;
    padding: 0.75rem;
    font-size: 1rem;
    margin-bottom: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(0,0,0,0.1);
    color: var(--text);
  }
  input[type="password"]:focus {
    outline: 2px solid var(--focus);
    border-color: var(--focus);
  }
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    color: var(--text);
    cursor: pointer;
  }
  .checkbox-row input { cursor: pointer; }
  .ttl-box {
    margin-bottom: 1.15rem;
  }
  .ttl-row {
    background: rgba(31, 111, 235, 0.08);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.65rem 0.85rem;
    margin: 0;
    transition: all 0.2s ease;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .ttl-row:hover {
    border-color: var(--focus);
    background: rgba(31, 111, 235, 0.14);
  }
  .ttl-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .ttl-row input:checked ~ .ttl-text {
    color: var(--accent);
    font-weight: 600;
  }
  .ttl-row input:checked ~ .ttl-text .ttl-tag {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
  }
  .ttl-text {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.92rem;
    cursor: pointer;
    flex: 1;
  }
  .ttl-icon-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
  }
  .ttl-icon-svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
    color: var(--accent-blue);
    animation: ttl-clock 3s ease-in-out infinite alternate;
  }
  @keyframes ttl-clock {
    0% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(18deg) scale(1.12); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .ttl-tag {
    margin-left: auto;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0.15rem 0.45rem;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    color: var(--text-muted);
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
  }
  /* the status line lives directly under the header, so a success or an
     error is visible the moment it happens - no scrolling to find out
     whether the tap worked. empty until the first message, so it takes
     no space while the user is still approving. */
  #msg {
    margin: 0 0 1rem;
    font-weight: 500;
    font-size: 0.95rem;
    word-break: break-word;
    text-align: center;
  }
  #msg:empty { display: none; }
  #msg.success {
    color: #ffffff;
    background: var(--accent);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    font-size: 1.05rem;
    font-weight: 600;
  }
  #msg.error {
    color: #ffffff;
    background: var(--danger);
    border-radius: 8px;
    padding: 0.9rem 1rem;
    font-weight: 600;
  }
  /* legacy-enrolment warning (H3): loud, always visible while a legacy
     enrolment is stored — never a silent fallback */
  #legacy-note {
    display: none;
    margin: 0 0 1rem;
    padding: 0.75rem 1rem;
    border: 1px solid var(--danger);
    border-radius: 8px;
    background: rgba(248, 81, 73, 0.12);
    color: var(--text);
    font-size: 0.88rem;
    text-align: center;
  }
  /* a request that outlived the runner's wait: visibly dead, not approvable */
  .expiry-line {
    margin: -0.5rem 0 1.25rem;
    text-align: center;
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
  }
  .expiry-line.is-near { color: var(--danger); font-weight: 600; }
  .card.stale { border-color: var(--danger); }
  .card.stale button { display: none; }
  #fb {
    margin-top: 1.25rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }
  textarea {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(0,0,0,0.15);
    color: var(--text);
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div id="icon-container" class="icon-wrap waiting">
      <!-- Animated Lock SVG (Rule 10) -->
      <svg class="icon-svg" viewBox="0 0 24 24">
        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
      </svg>
    </div>
    <div id="badge-wrap"><span class="badge" id="host-badge">Mainframe Restore</span></div>
    <h2 id="title">Vault Approval Request</h2>
    <p id="desc">Runner is waiting for authorization to unlock Bitwarden secrets.</p>
  </div>

  <!-- status line: under the header so success/errors need no scrolling -->
  <p id="msg"></p>

  <!-- legacy-enrolment warning (H3): shown whenever the stored fingerprint
       enrolment uses the legacy method instead of PRF -->
  <p id="legacy-note"></p>

  <!-- Number Matching Card -->
  <div id="verify-box" class="verify-card" style="display:none">
    <div class="verify-label">Verification Code</div>
    <div class="verify-number" id="verify-code">--</div>
    <div class="verify-sub">Confirm this number matches your terminal screen</div>
    <div class="verify-meta" id="verify-meta">
      <span class="meta-tag" id="meta-host" style="display:none">
        <span class="tag-icon icon-host">💻</span>
        <span class="tag-text"></span>
      </span>
      <span class="meta-tag" id="meta-agent" style="display:none">
        <span class="tag-icon icon-agent">🤖</span>
        <span class="tag-text"></span>
      </span>
      <span class="meta-tag" id="meta-model" style="display:none">
        <span class="tag-icon icon-model">🧠</span>
        <span class="tag-text"></span>
      </span>
      <span class="meta-tag" id="meta-ctx" style="display:none">
        <span class="tag-icon icon-ctx">⚡</span>
        <span class="tag-text"></span>
      </span>
    </div>
  </div>

  <!-- how much of this request's wait window is left (empty for old links) -->
  <div id="expiry-line" class="expiry-line" style="display:none"></div>

  <!-- 12-Hour Extended Session Checkbox -->
  <div id="ttl-box" class="ttl-box" style="display:none">
    <label class="checkbox-row ttl-row" id="ttl-row">
      <input type="checkbox" id="ttl-12h">
      <span class="ttl-text">
        <span class="ttl-icon-wrap">
          <svg class="ttl-icon-svg" viewBox="0 0 24 24">
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm4.2 14.2L11 13V7h1.5v5.2l4.5 2.7-.8 1.3z"/>
          </svg>
        </span>
        Keep unlocked for 12 hours
        <span class="ttl-tag">12h</span>
      </span>
    </label>
  </div>

  <!-- 1-Tap Biometric Approval Section -->
  <div id="bio-section" style="display:none">    <button id="bio-btn" type="button">
      <svg style="width:20px;height:20px;fill:currentColor" viewBox="0 0 24 24">
        <path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 5.92 1.5.24.13.33.43.2.67-.09.18-.21.3-.32.3zm2.59 4.19c-.1-.01-.19-.04-.27-.09-.23-.14-.3-.44-.16-.67.9-1.46 1.39-3.14 1.39-4.88 0-.27.22-.5.5-.5s.5.23.5.5c0 1.9-.53 3.74-1.52 5.33-.11.19-.29.31-.44.31zm-15.6.73c-.09 0-.18-.03-.26-.08-.98-1.59-1.52-3.43-1.52-5.33 0-.27.22-.5.5-.5s.5.23.5.5c0 1.74.49 3.42 1.39 4.88.14.23.07.53-.16.67-.14.09-.3.14-.45.14zm12.44 3.78c-.24 0-.46-.17-.49-.42-.25-2.02-.99-3.9-2.14-5.46-.17-.22-.12-.54.1-.71.22-.17.54-.12.71.1 1.25 1.7 2.06 3.75 2.33 5.96.03.27-.15.52-.42.55-.03 0-.06-.02-.09-.02zm-10.48 0c-.03 0-.06.01-.09.02-.28-.03-.45-.28-.42-.55.27-2.21 1.08-4.26 2.33-5.96.17-.22.49-.27.71-.1.22.17.27.49.1.71-1.15 1.56-1.89 3.44-2.14 5.46-.03.25-.25.42-.49.42zm7.74 3.96c-.19 0-.37-.11-.45-.29-.68-1.55-1.74-2.88-3.07-3.84-.22-.16-.27-.48-.11-.7.16-.22.47-.27.7-.11 1.45 1.05 2.62 2.5 3.36 4.2.11.25-.01.55-.26.66-.06.05-.12.08-.17.08zm-5.01 0c-.05 0-.11-.03-.17-.08-.25-.11-.37-.41-.26-.66.74-1.7 1.91-3.15 3.36-4.2.23-.16.54-.11.7.11.16.22.11.54-.11.7-1.33.96-2.39 2.29-3.07 3.84-.08.18-.26.29-.45.29zm2.46 4.87c-1.4 0-2.73-.39-3.88-1.12-.23-.15-.3-.45-.15-.68.15-.23.46-.3.69-.15.98.63 2.12.96 3.34.96 1.48 0 2.85-.48 3.96-1.38.21-.18.53-.14.71.07.18.21.14.53-.07.71-1.31 1.06-2.93 1.59-4.6 1.59z"/>
      </svg>
      Approve with Fingerprint
    </button>
    <button id="switch-manual" class="btn-secondary" type="button">Use master password manually</button>
  </div>

  <!-- Manual Entry & Enrollment Form -->
  <form id="f" style="display:none">
    <input id="pw" type="password" autocomplete="off" spellcheck="false"
      placeholder="Bitwarden master password">
    <label class="checkbox-row" id="save-row">
      <input type="checkbox" id="save-bio" checked>
      <span>Save for 1-tap fingerprint approval on this device</span>
    </label>
    <button id="go" type="submit">Send encrypted password</button>
    <button id="clear-bio" class="btn-secondary" type="button" style="display:none">Reset biometric enrollment</button>
  </form>

  <div id="fb" style="display:none">
    <p>If the script didn't pick up the relay automatically, copy this ciphertext:</p>
    <textarea id="ct" readonly rows="3"></textarea>
  </div>
</div>

<script>
const STORE_KEY_ENC = 'mf_vault_enc';
const STORE_KEY_SALT = 'mf_vault_salt';
const STORE_KEY_IV = 'mf_vault_iv';
const STORE_KEY_CRED = 'mf_bio_cred';
const STORE_KEY_MODE = 'mf_vault_mode'; // 'prf' | 'legacy' — absent means legacy (pre-PRF enrolment)
const STORE_KEY_PRF_SALT = 'mf_vault_prf_salt';

// C1: link signing — SHARED-KEY design (not per-machine registration: that
// needed a manual step per machine and was rejected). The runner signs
// k/sid/code/exp/srv with ECDSA P-256 + SHA-256; the signature is 64-byte raw
// R||S (P1363), base64url, in the fragment param `sig`. This pinned public
// key is PUBLIC — safe to embed in the page source.
// Rollout is WARN-THEN-ENFORCE: while ENFORCE_SIGNING is false, unsigned or
// invalid links show a red banner but still allow approval; flipping this ONE
// constant to true refuses them outright. A valid signature shows no banner.
const ENFORCE_SIGNING = false;
const SIGNING_PUBLIC_KEY_JWK = { kty: 'EC', crv: 'P-256', x: '-h4maTaG7yjGXzGcwgADSHpC8M2lS6bu88p4yGyZ9-Q', y: 'Y8LcTvnYiRGwX6YxFWQ_OZGARJHuK9fRZbiNjlUWrXA' };

// H3: loud note shown whenever the stored enrolment uses the legacy method.
const LEGACY_NOTE_TEXT = 'legacy fingerprint enrolment — this device did not return PRF key material, so the stored password is protected by device access only, not by fingerprint hardware. clear the enrolment below and re-enrol with the password to retry the upgrade.';

// L17: RSA-2048 + OAEP-SHA256 plaintext ceiling: 256 - 2*32 - 2 = 190 bytes.
const PLAINTEXT_LIMIT_BYTES = 190;

function show(text, type='') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = type;
}

// terminal success: the approval is sent, so the page becomes the
// confirmation. everything the user could still tap or type is hidden,
// the green banner is already at the top, and the view scrolls there.
function showDone(text) {
  show(text, 'success');
  for (const id of ['verify-box', 'expiry-line', 'ttl-box', 'bio-section', 'f']) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  }
  const title = document.getElementById('title');
  if (title) title.textContent = 'Approved';
  const desc = document.getElementById('desc');
  if (desc) desc.style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ---- request freshness ------------------------------------------------------
// a request only exists while the runner is still waiting for it. two signals
// keep this page honest:
//   - `exp` in the link (unix seconds) = the runner's own deadline, so an old
//     notification says "stale" instead of offering a tap that can never land.
//   - an `mf:expired` marker the runner publishes on the session topic when it
//     gives up. that catches clock skew and flips a tab that is already open.
// without this the page happily announced "approved" for requests nobody was
// listening to any more.

// The relay the runner reads from. There is NO default: the runner passes
// `srv=<relay base>` in the link fragment, and a link without `srv` is
// refused outright below — the page never silently falls back to public
// ntfy.sh (M10). The phone side keeps using the same ntfy app either way.
let NTFY_BASE = null;
const REQUEST = { expiresAt: null, sid: null, host: null, stale: false, timer: null, markerTimer: null, relayDown: false };

// Trust model: every approval link is signed by the runner (ECDSA P-256 over
// k/sid/code/exp/srv, shared key pinned above as SIGNING_PUBLIC_KEY_JWK) and
// verified here before any approve UI is shown — a link that fails the check
// cannot be a real runner's link. The card still shows host, agent, model and
// the verification code: check the code against the terminal before tapping
// approve. (An earlier per-machine registered-key design was removed
// 2026-11-15 because every new machine needed a manual registration step;
// the shared-key design replaces it with no per-machine setup.)

function fmtLeft(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  const r = s % 60;
  if (m < 60) return r ? `${m}m ${r}s` : `${m}m`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}

function goStale(reason) {
  if (REQUEST.stale) return;
  REQUEST.stale = true;
  clearInterval(REQUEST.timer);
  clearInterval(REQUEST.markerTimer);
  const card = document.querySelector('.card');
  if (card) card.classList.add('stale');
  const icon = document.getElementById('icon-container');
  if (icon) icon.className = 'icon-wrap error';
  const title = document.getElementById('title');
  if (title) title.textContent = 'Stale request';
  // never leave an expired code on screen with an approve button under it
  const verify = document.getElementById('verify-box');
  if (verify) verify.style.display = 'none';
  for (const id of ['bio-btn', 'go']) {
    const el = document.getElementById(id);
    if (el) el.disabled = true;
  }
  const desc = document.getElementById('desc');
  if (desc) desc.textContent = reason;
  // a dead request keeps no live countdown and no password field to type into
  const line = document.getElementById('expiry-line');
  if (line) {
    line.className = 'expiry-line';
    line.style.display = 'block';
    line.textContent = 'request closed';
  }
  for (const id of ['f', 'bio-section', 'ttl-box']) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  }
  show('stale request — ask the runner for a fresh push', 'error');
}

function updateExpiry() {
  const line = document.getElementById('expiry-line');
  if (!line) return;
  line.style.display = 'block';
  if (!REQUEST.expiresAt) {
    line.className = 'expiry-line';
    line.textContent = 'older runner link: no expiry in this link, so the page cannot tell when it went stale';
    return;
  }
  const left = REQUEST.expiresAt - Date.now();
  if (left <= 0) {
    goStale(`This request expired at ${new Date(REQUEST.expiresAt).toLocaleTimeString()} — the runner stopped waiting, so nothing was unlocked.`);
    return;
  }
  line.className = left < 15000 ? 'expiry-line is-near' : 'expiry-line';
  line.textContent = `request valid for ${fmtLeft(left)} more` + (REQUEST.relayDown ? ' · relay unreachable, link expiry only' : '');
}

async function pollExpiredMarker() {
  if (REQUEST.stale || !REQUEST.sid) return;
  let res;
  try {
    res = await fetch(`${NTFY_BASE}/${encodeURIComponent(REQUEST.sid)}/json?poll=1`, { cache: 'no-store' });
  } catch {
    REQUEST.relayDown = true;
    return;
  }
  if (!res.ok) {
    REQUEST.relayDown = true;
    return;
  }
  REQUEST.relayDown = false;
  const text = await res.text();
  for (const raw of text.split('\n')) {
    const row = raw.trim();
    if (!row) continue;
    let msg;
    try { msg = JSON.parse(row); } catch { continue; }
    const body = typeof msg.message === 'string' ? msg.message.trim() : '';
    if (!body.startsWith('{')) continue;
    let inner;
    try { inner = JSON.parse(body); } catch { continue; }
    if (inner && inner.mf === 'expired') {
      const at = inner.at ? new Date(inner.at * 1000).toLocaleTimeString() : null;
      goStale(`The runner gave up on this request${at ? ` at ${at}` : ''} — nothing was unlocked. Ask it for a fresh push.`);
      return;
    }
  }
}

function bytesToB64(bytes) {
  let bin = '';
  const len = bytes.byteLength;
  for (let i = 0; i < len; i++) {
    bin += String.fromCharCode(bytes[i]);
  }
  return btoa(bin);
}

function b64ToBytes(s) {
  if (!s) return new Uint8Array(0);
  let clean = s.trim().replace(/-/g, '+').replace(/_/g, '/');
  clean = clean.replace(/[^A-Za-z0-9+/]/g, '');
  const pad = clean.length % 4;
  if (pad === 2) clean += '==';
  else if (pad === 3) clean += '=';
  else if (pad === 1) clean = clean.slice(0, -1);
  const bin = atob(clean);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) {
    out[i] = bin.charCodeAt(i);
  }
  return out;
}

// base64url without padding — the form WebAuthn wants for credential ids
// (evalByCredential keys) and the form the runner uses for `sig`.
function bytesToB64Url(bytes) {
  return bytesToB64(bytes).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function getParams() {
  const hash = location.hash.startsWith('#') ? location.hash.slice(1) : location.hash;
  const params = new URLSearchParams(hash);
  const k = params.get('k') || (hash.match(/(?:^|&)k=([A-Za-z0-9_-]+)/) || [])[1];
  const sid = params.get('sid') || (hash.match(/(?:^|&)sid=([A-Za-z0-9_-]+)/) || [])[1];
  const code = params.get('code') || (hash.match(/(?:^|&)code=([0-9]+)/) || [])[1];
  const hostParam = params.get('host');
  const hostRaw = (hash.match(/(?:^|&)host=([^&]+)/) || [])[1];
  const ctxParam = params.get('ctx');
  const ctxRaw = (hash.match(/(?:^|&)ctx=([^&]+)/) || [])[1];
  const agentParam = params.get('agent');
  const agentRaw = (hash.match(/(?:^|&)agent=([^&]+)/) || [])[1];
  const modelParam = params.get('model');
  const modelRaw = (hash.match(/(?:^|&)model=([^&]+)/) || [])[1];
  const expRaw = params.get('exp') || (hash.match(/(?:^|&)exp=([0-9]+)/) || [])[1];
  const exp = expRaw ? Number(expRaw) : null;
  // URLSearchParams already percent-decodes, so only the raw-regex fallback
  // needs a manual decode - decoding twice would mangle a value that carries
  // a literal percent sign.
  const srvParam = params.get('srv');
  const srvRaw = (hash.match(/(?:^|&)srv=([^&]+)/) || [])[1];
  const srv = srvParam || (srvRaw ? decodeURIComponent(srvRaw) : null);
  const sig = params.get('sig') || (hash.match(/(?:^|&)sig=([A-Za-z0-9_-]+)/) || [])[1];
  return {
    k,
    sid,
    code,
    sig: sig || null,
    exp: Number.isFinite(exp) && exp > 0 ? exp : null,
    // expRaw / srvRaw are the EXACT fragment strings (pre-parse, pre-strip):
    // the signature is computed over them, so they must not be normalised.
    expRaw: expRaw || null,
    srv: srv ? srv.replace(/\/+$/, '') : null,
    srvRaw: srv || null,
    host: hostParam !== null ? hostParam : (hostRaw ? decodeURIComponent(hostRaw) : null),
    ctx: ctxParam !== null ? ctxParam : (ctxRaw ? decodeURIComponent(ctxRaw) : null),
    agent: agentParam !== null ? agentParam : (agentRaw ? decodeURIComponent(agentRaw) : null),
    model: modelParam !== null ? modelParam : (modelRaw ? decodeURIComponent(modelRaw) : null)
  };
}

// C1: verify the runner's signature over the exact fragment strings.
// Returns 'valid' | 'unsigned' | 'invalid'. The signed payload is
// k + LF + sid + LF + code + LF + exp + LF + srv (UTF-8); a missing value
// counts as the empty string. Any verification error counts as 'invalid'
// (fail closed on the check itself — the warn/enforce decision is the
// caller's, via ENFORCE_SIGNING).
async function verifyLinkSignature(p) {
  if (!p.sig) return 'unsigned';
  try {
    const key = await crypto.subtle.importKey(
      'jwk', SIGNING_PUBLIC_KEY_JWK, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']
    );
    const payload = [p.k || '', p.sid || '', p.code || '', p.expRaw || '', p.srvRaw || ''].join('\n');
    const sigBytes = b64ToBytes(p.sig);
    if (sigBytes.length !== 64) return 'invalid';
    const ok = await crypto.subtle.verify(
      { name: 'ECDSA', hash: 'SHA-256' }, key, sigBytes, new TextEncoder().encode(payload)
    );
    return ok ? 'valid' : 'invalid';
  } catch {
    return 'invalid';
  }
}

function showLegacyNote() {
  const note = document.getElementById('legacy-note');
  if (note) {
    note.textContent = LEGACY_NOTE_TEXT;
    note.style.display = 'block';
  }
}

function hideLegacyNote() {
  const note = document.getElementById('legacy-note');
  if (note) note.style.display = 'none';
}

// Legacy enrolment key derivation (H3): the PBKDF2 input is a PUBLIC constant,
// so this is obfuscation, not encryption — anyone holding the localStorage
// values can reimplement this from the public page source and decrypt the
// stored password offline, no fingerprint needed. Kept ONLY so enrolments made
// before the PRF rework keep working until the user re-enrols once by typing
// the password; new enrolments use deriveKeyFromPrf when the authenticator
// returns PRF output.
async function deriveLocalKey(salt) {
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode('mainframe-local-keystore-v1'), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

// H3: PRF-based enrolment key. The 32-byte PRF output is credential-scoped
// secret material that never leaves the authenticator — it is NOT in
// localStorage, so the stored enrolment cannot be decrypted offline from
// browser storage alone. The PRF salt is a per-enrolment random value kept in
// localStorage (it is an input, not a secret). HKDF turns the PRF output into
// the AES-GCM key (the KDF pattern Yubico recommends for PRF encryption).
async function deriveKeyFromPrf(prfOutput, salt) {
  const baseKey = await crypto.subtle.importKey('raw', prfOutput, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'HKDF', hash: 'SHA-256', salt: salt, info: new TextEncoder().encode('mainframe-vault-prf-v1') },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

// The PRF output of a create/get ceremony, or null when the authenticator did
// not return one (unsupported, or the extension was ignored).
function getPrfFirst(cred) {
  try {
    if (!cred || typeof cred.getClientExtensionResults !== 'function') return null;
    const ext = cred.getClientExtensionResults();
    const first = ext && ext.prf && ext.prf.results && ext.prf.results.first;
    return first ? new Uint8Array(first) : null;
  } catch {
    return null;
  }
}

// H3 hardening for BOTH enrolment modes: the assertion is actually checked
// instead of discarded — rpIdHash must match this origin, the UV (user
// verification) flag must be set, and the challenge must echo. Throws on any
// mismatch. (This does NOT fix the legacy mode's obfuscation-grade storage —
// it only proves the fingerprint ceremony really happened for this site.)
async function verifyAssertion(assertion, challenge) {
  const response = assertion && assertion.response;
  if (!response || !response.authenticatorData || !response.clientDataJSON) {
    throw new Error('Biometric assertion is missing data.');
  }
  const authData = new Uint8Array(response.authenticatorData);
  if (authData.length < 37) {
    throw new Error('Biometric assertion is malformed.');
  }
  // flags byte (offset 32), bit 2 (0x04) = user verified
  if ((authData[32] & 0x04) === 0) {
    throw new Error('Biometric verification did not confirm the user.');
  }
  const rpIdHash = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(window.location.hostname)));
  for (let i = 0; i < 32; i++) {
    if (authData[i] !== rpIdHash[i]) {
      throw new Error('Biometric assertion is for a different site.');
    }
  }
  let clientData;
  try {
    clientData = JSON.parse(new TextDecoder().decode(response.clientDataJSON));
  } catch {
    throw new Error('Biometric assertion has unreadable client data.');
  }
  if (!clientData || clientData.type !== 'webauthn.get') {
    throw new Error('Biometric assertion has the wrong type.');
  }
  const echoed = b64ToBytes(clientData.challenge || '');
  if (echoed.length !== challenge.length) {
    throw new Error('Biometric assertion challenge mismatch.');
  }
  for (let i = 0; i < echoed.length; i++) {
    if (echoed[i] !== challenge[i]) {
      throw new Error('Biometric assertion challenge mismatch.');
    }
  }
}

async function encryptForRunner(plaintext, spkiPubBase64) {
  // L17: RSA-2048 + OAEP-SHA256 caps the plaintext at 190 bytes. Fail LOUDLY
  // with the real reason instead of a generic WebCrypto error.
  const plainBytes = new TextEncoder().encode(plaintext);
  if (plainBytes.length > PLAINTEXT_LIMIT_BYTES) {
    throw new Error('password too long for approval encryption — maximum 190 bytes');
  }
  const keyBytes = b64ToBytes(spkiPubBase64);
  const key = await crypto.subtle.importKey(
    'spki',
    keyBytes,
    { name: 'RSA-OAEP', hash: 'SHA-256' },
    false,
    ['encrypt']
  );
  const ct = await crypto.subtle.encrypt(
    { name: 'RSA-OAEP' },
    key,
    plainBytes
  );
  return bytesToB64(new Uint8Array(ct));
}

async function transmitCiphertext(b64, sid, is12h = false) {
  // a tap can land exactly on the deadline; refusing here is the difference
  // between "sent" and "sent into a topic nobody is reading"
  if (REQUEST.stale) {
    show('stale request — nothing was sent', 'error');
    return;
  }
  if (REQUEST.expiresAt && Date.now() >= REQUEST.expiresAt) {
    goStale('This request expired before the approval was sent — nothing was unlocked.');
    return;
  }

  document.getElementById('ct').value = b64;
  document.getElementById('fb').style.display = 'block';

  if (sid) {
    show('Transmitting encrypted password via relay...', 'waiting');
    const res = await fetch(`${NTFY_BASE}/${encodeURIComponent(sid)}`, {
      method: 'POST',
      headers: { 'Title': is12h ? 'Vault Ciphertext (12h)' : 'Vault Ciphertext' },
      body: b64
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const durMsg = is12h ? ' (12-hour session)' : '';
    showDone(`Ciphertext sent to ${REQUEST.host || 'the runner'}${durMsg} — it unlocks within a few seconds. You can close this tab.`);
    document.getElementById('icon-container').className = 'icon-wrap';
    document.getElementById('bio-btn').disabled = true;
  } else {
    const blob = new Blob([b64], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mainframe-vault-pass.enc';
    document.body.appendChild(a);
    a.click();
    a.remove();
    const durMsg = is12h ? ' (12-hour session)' : '';
    showDone(`Encrypted file downloaded${durMsg}. Restoring unattended.`);
  }
}

// Biometric enrollment. Returns the enrolment mode: 'prf' when the
// authenticator returned PRF key material, 'legacy' when it did not.
// PRF (WebAuthn Level 3, Chrome 116+ incl. Chrome on Android via Google
// Password Manager): the AES-GCM key comes from the authenticator's PRF
// output, so the stored enrolment cannot be decrypted offline from
// localStorage alone. Legacy keeps the old public-constant PBKDF2 and is
// only used when PRF is unavailable — the caller shows a LOUD on-page note
// for it, never a silent fallback.
async function enrollBiometric(password) {
  if (!window.PublicKeyCredential) {
    throw new Error('Biometrics not supported in this browser.');
  }
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const prfSalt = crypto.getRandomValues(new Uint8Array(32));
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: challenge,
      rp: { name: 'Mainframe Vault', id: window.location.hostname },
      user: {
        id: crypto.getRandomValues(new Uint8Array(16)),
        name: 'owner',
        displayName: 'Device Owner'
      },
      pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
      authenticatorSelection: {
        authenticatorAttachment: 'platform',
        userVerification: 'required'
      },
      timeout: 60000,
      extensions: { prf: { eval: { first: prfSalt } } }
    }
  });

  const rawIdBytes = cred.rawId ? new Uint8Array(cred.rawId) : b64ToBytes(cred.id);

  // PRF output first: some authenticators answer PRF at creation, others only
  // at authentication — so a missing create-time result gets one more chance
  // via a second (get) ceremony before falling back to legacy. The second
  // ceremony costs one extra fingerprint prompt, once, at enrolment.
  let prfOutput = getPrfFirst(cred);
  if (!prfOutput) {
    try {
      const probe = await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ id: rawIdBytes, type: 'public-key' }],
          userVerification: 'required',
          timeout: 60000,
          extensions: { prf: { evalByCredential: { [bytesToB64Url(rawIdBytes)]: { first: prfSalt } } } }
        }
      });
      prfOutput = getPrfFirst(probe);
    } catch {
      prfOutput = null;
    }
  }

  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  let aesKey;
  let mode;
  if (prfOutput) {
    aesKey = await deriveKeyFromPrf(prfOutput, prfSalt);
    mode = 'prf';
  } else {
    aesKey = await deriveLocalKey(salt);
    mode = 'legacy';
  }
  const encrypted = await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv: iv },
    aesKey,
    new TextEncoder().encode(password)
  );

  localStorage.setItem(STORE_KEY_CRED, bytesToB64(rawIdBytes));
  localStorage.setItem(STORE_KEY_SALT, bytesToB64(salt));
  localStorage.setItem(STORE_KEY_IV, bytesToB64(iv));
  localStorage.setItem(STORE_KEY_ENC, bytesToB64(new Uint8Array(encrypted)));
  localStorage.setItem(STORE_KEY_MODE, mode);
  if (mode === 'prf') {
    localStorage.setItem(STORE_KEY_PRF_SALT, bytesToB64(prfSalt));
  } else {
    localStorage.removeItem(STORE_KEY_PRF_SALT);
  }
  return mode;
}

// Biometric unlock. Mode comes from localStorage: 'prf' enrolments unwrap the
// key from the authenticator's PRF output (the fingerprint is a real
// cryptographic factor there); enrolments with no stored mode predate the PRF
// rework and keep using the legacy public-constant derivation exactly as
// before, until the user re-enrols once by typing the password.
async function approveWithBiometrics() {
  const credB64 = localStorage.getItem(STORE_KEY_CRED);
  const encB64 = localStorage.getItem(STORE_KEY_ENC);
  const saltB64 = localStorage.getItem(STORE_KEY_SALT);
  const ivB64 = localStorage.getItem(STORE_KEY_IV);
  const mode = localStorage.getItem(STORE_KEY_MODE) || 'legacy';
  const prfSaltB64 = localStorage.getItem(STORE_KEY_PRF_SALT);

  if (!credB64 || !encB64 || !ivB64) {
    throw new Error('No biometric credential enrolled.');
  }
  if (mode === 'prf' && !prfSaltB64) {
    throw new Error('Biometric enrolment is incomplete (missing PRF salt). Clear the enrolment below and re-enrol with the password.');
  }
  if (mode !== 'prf' && !saltB64) {
    throw new Error('Biometric enrolment is incomplete. Clear the enrolment below and re-enrol with the password.');
  }

  const credBytes = b64ToBytes(credB64);
  const challenge = crypto.getRandomValues(new Uint8Array(32));
  const requestOptions = {
    challenge: challenge,
    allowCredentials: [{ id: credBytes, type: 'public-key' }],
    userVerification: 'required',
    timeout: 60000
  };
  if (mode === 'prf') {
    requestOptions.extensions = { prf: { evalByCredential: { [bytesToB64Url(credBytes)]: { first: b64ToBytes(prfSaltB64) } } } };
  }
  const assertion = await navigator.credentials.get({
    publicKey: requestOptions
  });

  if (!assertion) throw new Error('Biometric verification cancelled.');
  await verifyAssertion(assertion, challenge);

  const iv = b64ToBytes(ivB64);
  const ct = b64ToBytes(encB64);
  let aesKey;
  if (mode === 'prf') {
    const prfOutput = getPrfFirst(assertion);
    if (!prfOutput) {
      throw new Error('This enrolment needs PRF key material from the authenticator, but none was returned. Clear the enrolment below and re-enrol with the password.');
    }
    aesKey = await deriveKeyFromPrf(prfOutput, b64ToBytes(prfSaltB64));
  } else {
    aesKey = await deriveLocalKey(b64ToBytes(saltB64));
  }
  const decryptedBuf = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: iv },
    aesKey,
    ct
  );
  return new TextDecoder().decode(decryptedBuf);
}

window.addEventListener('hashchange', () => {
  location.reload();
});

document.addEventListener('DOMContentLoaded', async () => {
  const params = getParams();
  const { k, sid, code, exp, srv, host, ctx, agent, model } = params;
  // M10: no relay in the link means no approve UI — never fall back to
  // public ntfy.sh.
  if (!srv) {
    show('No relay in this link (missing srv) — refusing to fall back to public ntfy.sh. Request a fresh link from the runner.', 'error');
    document.getElementById('icon-container').className = 'icon-wrap error';
    return;
  }
  NTFY_BASE = srv;
  if (!k || k.length < 50) {
    show('Invalid or missing public key in URL link. Request a fresh link from runner.', 'error');
    document.getElementById('icon-container').className = 'icon-wrap error';
    return;
  }

  // C1: verify the runner's signature BEFORE any approve UI is shown.
  // Warn-then-enforce: while ENFORCE_SIGNING is false, unsigned/invalid links
  // show a red banner but still allow approval; flipping that one constant
  // refuses them outright. A valid signature shows no banner.
  const sigState = await verifyLinkSignature(params);
  if (sigState === 'unsigned') {
    if (ENFORCE_SIGNING) {
      show('This link is not signed — refusing to approve. Request a fresh link from the runner.', 'error');
      document.getElementById('icon-container').className = 'icon-wrap error';
      return;
    }
    show('this link is not signed — approve only if you started this request yourself', 'error');
  } else if (sigState === 'invalid') {
    if (ENFORCE_SIGNING) {
      show('Signature check FAILED — this link may be forged. Refusing to approve.', 'error');
      document.getElementById('icon-container').className = 'icon-wrap error';
      return;
    }
    show('signature check FAILED — this link may be forged. do not approve unless you are certain', 'error');
    document.getElementById('icon-container').className = 'icon-wrap error';
  }

  if (code) {
    document.getElementById('verify-box').style.display = 'block';
    document.getElementById('verify-code').textContent = code;
    if (host) {
      const el = document.getElementById('meta-host');
      el.querySelector('.tag-text').textContent = host;
      el.style.display = 'inline-flex';
    }
    if (agent) {
      const el = document.getElementById('meta-agent');
      const icon = el.querySelector('.tag-icon');
      if (icon) {
        icon.textContent = (agent.toLowerCase().includes('browser') || agent.toLowerCase().includes('monitor')) ? '🌐' : '🤖';
      }
      el.querySelector('.tag-text').textContent = agent;
      el.style.display = 'inline-flex';
    }
    if (model) {
      const el = document.getElementById('meta-model');
      el.querySelector('.tag-text').textContent = model;
      el.style.display = 'inline-flex';
    }
    if (ctx) {
      const el = document.getElementById('meta-ctx');
      el.querySelector('.tag-text').textContent = ctx;
      el.style.display = 'inline-flex';
    }
    const badge = document.getElementById('host-badge');
    if (badge) {
      if (agent && host) {
        badge.textContent = `${agent} @ ${host}`;
      } else if (host) {
        badge.textContent = host;
      } else if (agent) {
        badge.textContent = agent;
      }
    }
    const desc = document.getElementById('desc');
    if (desc) {
      const caller = agent ? agent : 'Runner';
      const onHost = host ? ` on ${host}` : '';
      desc.textContent = `${caller}${onHost} is waiting for authorization to unlock Bitwarden secrets.`;
    }
  }

  // freshness first: everything below wires up approval buttons, and an expired
  // request must never reach them
  REQUEST.expiresAt = exp ? exp * 1000 : null;
  REQUEST.sid = sid || null;
  REQUEST.host = host || null;
  updateExpiry();
  if (REQUEST.stale) return;
  if (REQUEST.expiresAt) {
    REQUEST.timer = setInterval(updateExpiry, 1000);
  }
  if (REQUEST.sid) {
    void pollExpiredMarker();
    REQUEST.markerTimer = setInterval(pollExpiredMarker, 5000);
  }

  const isEnrolled = !!localStorage.getItem(STORE_KEY_ENC);
  // H3: a legacy enrolment (including every enrolment made before the PRF
  // rework, which stores no mode) gets the loud note until re-enrolled.
  if (isEnrolled && (localStorage.getItem(STORE_KEY_MODE) || 'legacy') !== 'prf') {
    showLegacyNote();
  }
  const bioSection = document.getElementById('bio-section');
  const formSection = document.getElementById('f');
  const clearBtn = document.getElementById('clear-bio');
  const ttlBox = document.getElementById('ttl-box');

  if (ttlBox) {
    ttlBox.style.display = 'block';
  }

  if (isEnrolled && window.PublicKeyCredential) {
    bioSection.style.display = 'block';
    formSection.style.display = 'none';
  } else {
    bioSection.style.display = 'none';
    formSection.style.display = 'block';
    if (!window.PublicKeyCredential) {
      document.getElementById('save-row').style.display = 'none';
    }
  }

  if (isEnrolled) {
    clearBtn.style.display = 'inline-block';
  }

  document.getElementById('switch-manual').addEventListener('click', () => {
    bioSection.style.display = 'none';
    formSection.style.display = 'block';
  });

  clearBtn.addEventListener('click', () => {
    localStorage.removeItem(STORE_KEY_CRED);
    localStorage.removeItem(STORE_KEY_SALT);
    localStorage.removeItem(STORE_KEY_IV);
    localStorage.removeItem(STORE_KEY_ENC);
    localStorage.removeItem(STORE_KEY_MODE);
    localStorage.removeItem(STORE_KEY_PRF_SALT);
    hideLegacyNote();
    show('Biometric enrollment cleared. Enter master password below to re-enroll.', 'success');
    bioSection.style.display = 'none';
    formSection.style.display = 'block';
  });

  // Biometric button click
  document.getElementById('bio-btn').addEventListener('click', async () => {
    const btn = document.getElementById('bio-btn');
    btn.disabled = true;
    show('Verifying fingerprint...', 'waiting');
    try {
      const password = await approveWithBiometrics();
      const is12h = !!document.getElementById('ttl-12h')?.checked;
      const payload = is12h ? JSON.stringify({ pw: password, ttl: 720, ttlMinutes: 720 }) : password;
      const b64Cipher = await encryptForRunner(payload, k);
      await transmitCiphertext(b64Cipher, sid, is12h);
    } catch (err) {
      const errDetail = (err && (err.message || err.name || String(err))) || 'unknown error';
      show(`Biometric approval failed: ${errDetail}`, 'error');
      document.getElementById('icon-container').className = 'icon-wrap error';
      btn.disabled = false;
      document.getElementById('switch-manual').style.display = 'inline-block';
    }
  });

  // Manual submit & enroll
  formSection.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    if (!pw) {
      show('Please enter your Bitwarden master password.', 'error');
      return;
    }
    const goBtn = document.getElementById('go');
    goBtn.disabled = true;
    show('Encrypting and sending...', 'waiting');

    try {
      const shouldSave = document.getElementById('save-bio').checked;
      if (shouldSave && window.PublicKeyCredential) {
        try {
          const enrolledMode = await enrollBiometric(pw);
          if (enrolledMode === 'legacy') {
            // LOUD, never silent: this device did not return PRF material.
            showLegacyNote();
          } else {
            hideLegacyNote();
          }
        } catch (bioErr) {
          console.warn('Biometric enrollment skipped:', bioErr);
        }
      }
      const is12h = !!document.getElementById('ttl-12h')?.checked;
      const payload = is12h ? JSON.stringify({ pw: pw, ttl: 720, ttlMinutes: 720 }) : pw;
      const b64Cipher = await encryptForRunner(payload, k);
      await transmitCiphertext(b64Cipher, sid, is12h);
      document.getElementById('pw').value = '';
    } catch (err) {
      const errDetail = (err && (err.message || err.name || String(err))) || 'unknown error';
      show(`Submission failed: ${errDetail}`, 'error');
      document.getElementById('icon-container').className = 'icon-wrap error';
      goBtn.disabled = false;
    }
  });
});
</script>
</body>
</html>
